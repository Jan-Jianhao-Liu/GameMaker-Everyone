[project]
name = "game-agent-factory"
version = "0.1.0"
description = "AI 智能体自动化游戏开发流水线"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
    "gitpython>=3.1.0",
    "fastmcp>=3.4.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
gaf = "gaf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mcp-servers", "blender-addon", "godot-plugin", "game", ".venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"agents/designer/agent.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["gaf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
